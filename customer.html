<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پیگیری خودرو | صافکاری منتظری</title>
<style>
:root{--bg:#071016;--panel:#0e1920;--line:#23343d;--text:#eef8fb;--muted:#8ea4ad;--cyan:#18d9ee;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12242d,#071016 55%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{width:min(680px,92%);margin:0 auto;padding:42px 0}.brand{text-align:center;margin-bottom:24px}.brand h1{margin:0 0 8px;font-size:28px}.brand p{margin:0;color:var(--muted);font-size:13px}
.card{background:rgba(14,25,32,.96);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 70px #0007}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
input{width:100%;background:#091219;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;outline:none}input:focus{border-color:var(--cyan)}
.plate{display:grid;grid-template-columns:1fr .8fr 1.4fr 1fr;gap:7px;direction:ltr}.plate input{text-align:center;font-weight:bold}.ltr{direction:ltr}
button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--cyan);color:#031116;font-weight:bold;font-size:15px;cursor:pointer}
.msg{margin-top:14px;padding:12px;border-radius:12px;background:#091219;color:var(--muted);font-size:13px;display:none}.msg.error{display:block;color:#ff9999;border:1px solid #61343a}.msg.ok{display:block;color:#9ef4fc;border:1px solid #205d66}
.result{margin-top:18px;display:none}.result.show{display:block}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.platebig{font-size:22px;font-weight:bold}.code{color:var(--cyan);letter-spacing:4px;font-weight:bold}.status{margin:16px 0 10px;font-weight:bold}.bar{height:10px;background:#081117;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan);width:0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.meta div{background:#091219;border:1px solid var(--line);border-radius:12px;padding:12px}.meta small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.timeline{margin-top:16px}.step{display:flex;gap:10px;align-items:center;margin:9px 0;color:var(--muted);font-size:13px}.dot{width:10px;height:10px;border-radius:50%;background:#34454d}.step.done{color:var(--text)}.step.done .dot{background:var(--cyan)}
@media(max-width:520px){.grid,.meta{grid-template-columns:1fr}.full{grid-column:auto}.plate{grid-template-columns:1fr .7fr 1.3fr .9fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>پیگیری وضعیت خودرو</h1>
    <p>صافکاری منتظری — پلاک و کد پیگیری را وارد کنید</p>
  </div>
  <div class="card">
    <form id="trackForm">
      <div class="grid">
        <div class="full">
          <label class="label">پلاک خودرو</label>
          <div class="plate">
            <input id="p2" maxlength="2" inputmode="numeric" placeholder="۱۲" required>
            <input id="pl" maxlength="1" placeholder="ب" required>
            <input id="p3" maxlength="3" inputmode="numeric" placeholder="۳۴۵" required>
            <input id="pc" maxlength="2" inputmode="numeric" placeholder="۶۷" required>
          </div>
        </div>
        <div class="full">
          <label class="label" for="code">کد پیگیری ۴ رقمی</label>
          <input id="code" class="ltr" maxlength="4" inputmode="numeric" placeholder="مثلاً ۱۲۳۴" required>
        </div>
        <div class="full"><button type="submit">مشاهده وضعیت خودرو</button></div>
      </div>
    </form>
    <div id="msg" class="msg"></div>

    <section id="result" class="result">
      <div class="head">
        <div><div class="label">خودرو</div><div id="plateOut" class="platebig"></div></div>
        <div style="text-align:left"><div class="label">کد پیگیری</div><div id="codeOut" class="code"></div></div>
      </div>
      <div id="status" class="status"></div>
      <div class="bar"><i id="progress"></i></div>
      <div class="meta">
        <div><small>مدل خودرو</small><span id="model"></span></div>
        <div><small>تاریخ پذیرش</small><span id="received"></span></div>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>
  </div>
</div>

<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const stages=[
 {name:'پذیرش و ثبت اولیه',pct:0},
 {name:'کارشناسی و برآورد',pct:15},
 {name:'آماده‌سازی خودرو',pct:30},
 {name:'صافکاری بدنه',pct:50},
 {name:'زیرسازی و آماده‌سازی رنگ',pct:70},
 {name:'رنگ و پرداخت نهایی',pct:85},
 {name:'کنترل کیفیت',pct:95},
 {name:'آماده تحویل',pct:100}
];
const $=id=>document.getElementById(id);
const digits=s=>String(s??'').replace(/[۰-۹٠-٩]/g,ch=>{
 const fa='۰۱۲۳۴۵۶۷۸۹', ar='٠١٢٣٤٥٦٧٨٩', i=fa.indexOf(ch); return i>=0?String(i):String(ar.indexOf(ch));
});
function norm(s){return digits(s).toLowerCase().replace(/[\s\-ـ]/g,'')}
function plate(){return norm($('p2').value)+$('pl').value.trim().toLowerCase()+norm($('p3').value)+norm($('pc').value)}
function showMsg(t,err=true){$('msg').textContent=t;$('msg').className='msg '+(err?'error':'ok')}
function clearMsg(){$('msg').className='msg';$('msg').textContent=''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

for(const id of ['p2','pl','p3','pc']) $(id).addEventListener('input',()=>{
 const el=$(id), ids=['p2','pl','p3','pc'], n=ids[ids.indexOf(id)+1]; if(n && el.value.length>=el.maxLength)$(n).focus();
});

$('trackForm').addEventListener('submit',async e=>{
 e.preventDefault(); clearMsg(); $('result').classList.remove('show');
 const p=plate(), c=norm($('code').value);
 if(!/^\\d{2}.\\d{5}\\d{2}$/.test(p) || !/^\\d{4}$/.test(c)){showMsg('پلاک را کامل و کد پیگیری ۴ رقمی را درست وارد کن.');return}
 if(!window.supabase?.createClient || !window.MONT_SUPABASE_URL || !window.MONT_SUPABASE_ANON_KEY){showMsg('اتصال Supabase در این صفحه تنظیم نشده است.');return}
 const sb=window.supabase.createClient(window.MONT_SUPABASE_URL,window.MONT_SUPABASE_ANON_KEY);
 const {data,error}=await sb.rpc('lookup_vehicle_by_tracking',{p_plate:p,p_tracking_code:c});
 if(error){console.error(error);showMsg('خطا در اتصال به سامانه پیگیری. کد تابع Supabase را بررسی کن.');return}
 if(!data){showMsg('هیچ خودرویی با این پلاک و کد پیگیری ثبت نشده است.');return}
 const car=data, stage=stages[Math.max(0,Math.min(stages.length-1,Number(car.stage)||0))];
 $('plateOut').textContent=car.plate||p;$('codeOut').textContent=car.trackingCode||c;
 $('status').textContent=stage.name+' — '+stage.pct+'٪';$('progress').style.width=stage.pct+'%';
 $('model').textContent=car.model||'ثبت نشده';$('received').textContent=car.received||'ثبت نشده';
 $('timeline').innerHTML=stages.map((s,i)=>`<div class="step ${i<=Number(car.stage||0)?'done':''}"><span class="dot"></span><span>${esc(s.name)} — ${s.pct}٪</span></div>`).join('');
 $('result').classList.add('show');showMsg('پرونده پیدا شد و وضعیت خودرو از فضای ابری دریافت شد.',false);
});
</script>
</body>
</html>
