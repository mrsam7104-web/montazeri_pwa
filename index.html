
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d12">
<meta name="description" content="نرم‌افزار صافکاری منتظری">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="/icon-192.png">

<title>صافکاری منتظری</title>

<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;
background:radial-gradient(ellipse at 50% 0,#07313a,transparent 50%),#080d12;
color:#effbff;font-family:Tahoma,Arial,sans-serif;
display:grid;place-items:center;padding:20px
}
.card{
width:min(540px,100%);padding:28px;
border:1px solid #26343e;border-radius:24px;
background:#101820;text-align:center;
box-shadow:0 20px 70px #0006
}
.logo{width:120px;height:120px;object-fit:contain;margin-bottom:12px}
h1{font-size:25px;margin:8px 0;color:#13d8ef}
p{color:#a9bbc3;line-height:1.9}
.manager{margin:2px 0 12px;color:#13d8ef;font-size:14px;font-weight:bold;letter-spacing:.2px}
.links{display:grid;gap:12px;margin-top:24px}
a{
display:block;text-decoration:none;color:#effbff;
padding:17px;border-radius:14px;border:1px solid #1b6875;
background:#0b252c;font-weight:bold
}
a:first-child{background:#13d8ef;color:#071116;border-color:#13d8ef}
a.mon-ai{background:linear-gradient(110deg,#101c22,#082a30);border:1px solid #13d8ef;color:#13d8ef;box-shadow:0 0 22px #13d8ef14}
a.mon-ai:hover{background:#10333a;box-shadow:0 0 28px #13d8ef24}
.small{font-size:12px;color:#8ca0ac;margin-top:22px}
</style>
</head>

<body>
<main class="card">
<img class="logo" src="/icon-192.png" alt="لوگوی صافکاری منتظری">
<h1>صافکاری منتظری</h1>
<p class="manager">با مدیریت محمود منتظری</p>
<p>سامانه مدیریت صافکاری و پیگیری وضعیت خودرو</p>

<nav class="links">
<a href="/admin.html">ورود به پنل مدیریت صافکاری</a>
<a href="/customer.html">صفحه پیگیری مشتری</a>
<a class="mon-ai" href="/mon-ai.html">✦ ورود به MON AI — دستیار هوشمند</a>
</nav>

<p class="small">برای نصب برنامه، سایت را با Chrome باز کنید و از منوی مرورگر گزینه نصب برنامه را بزنید.</p>
</main>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', {scope: '/'})
      .catch(error => console.error('PWA:', error));
  });
}
</script>

<script>
async function askMONAI(message) {
  const response = await fetch(
    "https://mon-ai-api.mrsam7104.workers.dev",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          {
            role: "system",
            content: "تو MON AI، دستیار هوشمند سایت صافکاری منتظری هستی. فارسی، دوستانه، دقیق و مختصر پاسخ بده."
          },
          {
            role: "user",
            content: message
          }
        ]
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "خطا در ارتباط با هوش مصنوعی");
  }

  return data.choices?.[0]?.message?.content
    || "پاسخی دریافت نشد.";
}
</script>

</body>
</html>
