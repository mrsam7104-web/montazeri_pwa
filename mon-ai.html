<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050d10"><title>MON AI | همراه هوشمند</title><style>
*{box-sizing:border-box}:root{--bg:#050d10;--panel:#0a171b;--line:#16404a;--cyan:#22e0d0;--blue:#20a9c5;--text:#e8fffc;--muted:#8cb6b7}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#064c50 0,transparent 45%),radial-gradient(ellipse at 100% 90%,#062a40 0,transparent 35%),var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text)}.app{max-width:860px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 14px calc(12px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 2px 18px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--cyan),#087aa0);color:#041214;font-weight:900;font-size:23px;box-shadow:0 0 26px #22e0d044}.brand{flex:1}.brand h1{margin:0;font-size:20px;letter-spacing:1px}.brand p{margin:5px 0 0;color:var(--muted);font-size:12px}.back{color:var(--cyan);text-decoration:none;font-size:12px;border:1px solid var(--line);padding:9px 12px;border-radius:12px}.hero{padding:26px 2px 15px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px}.hero h2{font-size:clamp(23px,5vw,34px);margin:10px 0}.hero p{font-size:13px;color:var(--muted);line-height:1.9;margin:0}.chat{flex:1;min-height:260px;display:flex;flex-direction:column;gap:12px;padding:16px 0}.msg{max-width:85%;padding:13px 15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:18px}.assistant{align-self:flex-start;background:linear-gradient(145deg,#0c2226,#0a171d);border-top-right-radius:5px}.user{align-self:flex-end;background:linear-gradient(145deg,#087e83,#09546c);border-color:#1a999a;border-top-left-radius:5px}.time{display:block;font-size:10px;color:#a3d6d2;margin-top:5px}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip,.btn{font:inherit;cursor:pointer;color:var(--text);border:1px solid var(--line);background:#0b1c20;border-radius:999px;padding:9px 12px;font-size:12px}.composer{display:flex;gap:9px;align-items:flex-end;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 78%,transparent)}textarea{font:inherit;resize:none;min-height:48px;max-height:140px;flex:1;background:#09171b;border:1px solid #1b5058;color:var(--text);border-radius:16px;padding:13px;outline:none}textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #22e0d022}.send{width:50px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#041214;border:0;font-size:20px}.note{text-align:center;color:#70999a;font-size:10px;line-height:1.8;padding-bottom:8px}@media(max-width:520px){.msg{max-width:93%}.app{padding-inline:12px}}</style></head><body><main class="app"><header><div class="logo">M</div><div class="brand"><h1>MON AI</h1><p>همراه هوشمند تو · همیشه آماده‌ی شنیدن</p></div><a class="back" href="./index.html">صفحه اصلی</a></header><section class="hero"><div class="eyebrow">YOUR AI COMPANION</div><h2>اینجا می‌تونی خودت باشی.</h2><p>حرف بزن، خالی شو، فکر کن. بدون قضاوت گوش می‌دم. 💠</p></section><section class="chat" id="chat" aria-live="polite"><div class="msg assistant">سلام! من MON AI هستم. 💠<br>دوست داری از چی حرف بزنیم؟</div></section><div class="suggestions" id="suggestions"><button class="chip">امروز حالم خوب نیست</button><button class="chip">فقط بهم گوش بده</button><button class="chip">کمکم کن فکر کنم</button></div><form class="composer" id="form"><textarea id="message" rows="1" placeholder="پیامت رو اینجا بنویس..." aria-label="پیام"></textarea><button class="send" type="submit" aria-label="ارسال">➤</button></form><div class="note" id="status">رابط MON AI آماده است؛ برای پاسخ هوشمند باید سرور و API متصل شوند.</div></main><script>
const $=s=>document.querySelector(s),chat=$('#chat'),input=$('#message'),form=$('#form'),sendButton=form.querySelector('.send');
const API_URL='https://mon-ai-api.mrsam7104.workers.dev';
const history=[{role:'system',content:'تو MON AI، همراه هوشمند فارسی‌زبان و محترمانه‌ای هستی. با همدلی، دقت و پاسخ‌های نسبتاً کوتاه جواب بده. اگر کاربر فقط می‌خواهد درد دل کند، اول با دقت گوش بده و قضاوت نکن.'}];
function add(text,role){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;const t=document.createElement('span');t.className='time';t.textContent=new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});el.appendChild(t);chat.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'})}
async function send(text){text=(text||input.value).trim();if(!text||sendButton.disabled)return;input.value='';input.style.height='auto';$('#suggestions').style.display='none';add(text,'user');history.push({role:'user',content:text});sendButton.disabled=true;input.disabled=true;$('#status').textContent='MON AI در حال فکر کردن است…';const pending=document.createElement('div');pending.className='msg assistant';pending.textContent='دارم بهت فکر می‌کنم…';chat.appendChild(pending);pending.scrollIntoView({behavior:'smooth',block:'end'});
try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});let data;try{data=await response.json()}catch{throw new Error('پاسخ سرور قابل خواندن نیست.')}if(!response.ok)throw new Error(data?.error?.message||data?.error||('خطای سرور: '+response.status));const answer=data?.choices?.[0]?.message?.content;if(typeof answer!=='string'||!answer.trim())throw new Error('پاسخ خالی دریافت شد؛ تنظیمات مدل OpenRouter را بررسی کن.');pending.remove();add(answer.trim(),'assistant');history.push({role:'assistant',content:answer.trim()});$('#status').textContent='MON AI متصل است';}
catch(error){pending.remove();add('نتونستم پاسخ بگیرم. '+(error.message||'اتصال ناموفق بود.')+' اگر مشکل ادامه داشت، تنظیمات Worker و مدل OpenRouter رو بررسی کن.','assistant');$('#status').textContent='اتصال ناموفق؛ تنظیمات Worker/API را بررسی کن.';history.pop();}
finally{sendButton.disabled=false;input.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();send()});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#suggestions').addEventListener('click',e=>{if(e.target.classList.contains('chip'))send(e.target.textContent)});
</script></body></html>
