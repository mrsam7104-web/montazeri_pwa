<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050d10"><title>MON AI | همراه هوشمند</title><style>
*{box-sizing:border-box}:root{--bg:#050d10;--panel:#0a171b;--line:#16404a;--cyan:#22e0d0;--blue:#20a9c5;--text:#e8fffc;--muted:#8cb6b7}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#064c50 0,transparent 45%),radial-gradient(ellipse at 100% 90%,#062a40 0,transparent 35%),var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text)}.app{max-width:860px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 14px calc(12px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 2px 18px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--cyan),#087aa0);color:#041214;font-weight:900;font-size:23px;box-shadow:0 0 26px #22e0d044}.brand{flex:1}.brand h1{margin:0;font-size:20px;letter-spacing:1px}.brand p{margin:5px 0 0;color:var(--muted);font-size:12px}.back{color:var(--cyan);text-decoration:none;font-size:12px;border:1px solid var(--line);padding:9px 12px;border-radius:12px}.hero{padding:26px 2px 15px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px}.hero h2{font-size:clamp(23px,5vw,34px);margin:10px 0}.hero p{font-size:13px;color:var(--muted);line-height:1.9;margin:0}.chat{flex:1;min-height:260px;display:flex;flex-direction:column;gap:12px;padding:16px 0}.msg{max-width:85%;padding:13px 15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:18px}.assistant{align-self:flex-start;background:linear-gradient(145deg,#0c2226,#0a171d);border-top-right-radius:5px}.user{align-self:flex-end;background:linear-gradient(145deg,#087e83,#09546c);border-color:#1a999a;border-top-left-radius:5px}.time{display:block;font-size:10px;color:#a3d6d2;margin-top:5px}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip,.btn{font:inherit;cursor:pointer;color:var(--text);border:1px solid var(--line);background:#0b1c20;border-radius:999px;padding:9px 12px;font-size:12px}.composer{display:flex;gap:9px;align-items:flex-end;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 78%,transparent)}textarea{font:inherit;resize:none;min-height:48px;max-height:140px;flex:1;background:#09171b;border:1px solid #1b5058;color:var(--text);border-radius:16px;padding:13px;outline:none}textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #22e0d022}.send{width:50px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#041214;border:0;font-size:20px}.note{text-align:center;color:#70999a;font-size:10px;line-height:1.8;padding-bottom:8px}@media(max-width:520px){.msg{max-width:93%}.app{padding-inline:12px}}
/* MON AI — cinematic motion layer */
:root{--glass:rgba(7,25,30,.62);--glow:rgba(34,224,208,.22)}
html{scroll-behavior:smooth}body{isolation:isolate;overflow-x:hidden;background-color:#03090d;background-image:radial-gradient(ellipse at 50% -10%,#075357 0,transparent 43%),radial-gradient(ellipse at 100% 75%,#07314a 0,transparent 36%),radial-gradient(ellipse at 0% 55%,#082d30 0,transparent 30%),linear-gradient(145deg,#03090d,#061217 55%,#030a11);background-attachment:fixed}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(2px);will-change:transform;opacity:.45}
body:before{width:46vw;height:46vw;min-width:280px;min-height:280px;top:8%;left:-18%;background:radial-gradient(circle,rgba(18,211,199,.16),rgba(18,211,199,.035) 45%,transparent 70%);animation:monOrbA 22s ease-in-out infinite alternate}
body:after{width:52vw;height:52vw;min-width:320px;min-height:320px;right:-20%;bottom:-12%;background:radial-gradient(circle,rgba(21,146,202,.16),rgba(16,107,145,.035) 48%,transparent 70%);animation:monOrbB 28s ease-in-out infinite alternate}
.app{position:relative;z-index:0}.app:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.15;background-image:radial-gradient(#6cf8ec 0.65px,transparent .65px);background-size:29px 29px;mask-image:linear-gradient(to bottom,black,transparent 88%);animation:monDust 36s linear infinite}
header{position:relative;border-bottom-color:rgba(34,224,208,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:monEnter .85s cubic-bezier(.2,.75,.2,1) both}
header:after{content:"";position:absolute;bottom:-1px;right:0;width:42%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 12px var(--cyan);animation:monLine 5s ease-in-out infinite}
.logo{position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(255,255,255,.28);background:linear-gradient(145deg,#7bfff1 0%,#22e0d0 35%,#087aa0 100%);box-shadow:0 0 0 5px rgba(34,224,208,.045),0 0 30px #22e0d04a,inset 0 1px 0 #ffffff88;animation:monLogoFloat 5s ease-in-out infinite}
.logo:after{content:"";position:absolute;inset:-60%;background:linear-gradient(105deg,transparent 38%,#ffffffa8 49%,transparent 60%);transform:translateX(-120%) rotate(20deg);animation:monShine 6s ease-in-out infinite}
.brand h1{text-shadow:0 0 22px #22e0d02a;animation:monTextGlow 5s ease-in-out infinite}.back,.chip,.btn{position:relative;overflow:hidden;background:rgba(10,31,36,.58);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:rgba(34,224,208,.23);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease}
.back:before,.chip:before,.btn:before,.send:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.17) 48%,transparent 70%);transform:translateX(-130%);transition:transform .7s ease}
.back:hover,.chip:hover,.btn:hover{transform:translateY(-3px);border-color:rgba(34,224,208,.75);box-shadow:0 8px 25px #22e0d01c,0 0 16px #22e0d012;background:rgba(12,48,52,.78)}.back:hover:before,.chip:hover:before,.btn:hover:before,.send:hover:before{transform:translateX(130%)}
.hero{position:relative;padding-top:clamp(28px,5vh,48px);padding-bottom:24px;animation:monEnter .9s .12s both}.eyebrow{display:inline-flex;align-items:center;gap:9px;text-shadow:0 0 16px #22e0d066}.eyebrow:before{content:"";width:22px;height:1px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:monLine 3s ease-in-out infinite}.hero h2{max-width:680px;line-height:1.55;text-wrap:balance;text-shadow:0 5px 28px #0008;animation:monHeroGlow 6s ease-in-out infinite}.hero p{max-width:620px}.chat{position:relative}.msg{position:relative;overflow:hidden;box-shadow:0 10px 28px #0002;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:monBubbleIn .42s cubic-bezier(.2,.8,.2,1) both;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}.assistant{background:linear-gradient(135deg,rgba(14,43,47,.82),rgba(7,22,29,.76));border-color:rgba(34,224,208,.2);box-shadow:inset 0 1px 0 #ffffff0b,0 10px 28px #0002}.assistant:before{content:"";position:absolute;top:0;right:14px;width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.65}.user{background:linear-gradient(135deg,rgba(8,126,131,.9),rgba(7,66,88,.84));border-color:rgba(70,255,239,.32);box-shadow:inset 0 1px 0 #ffffff16,0 8px 26px #008d991b}.msg:hover{transform:translateY(-2px);border-color:rgba(34,224,208,.42);box-shadow:0 14px 35px #0003,0 0 20px #22e0d00b}.time{opacity:.8}.suggestions{animation:monEnter .8s .25s both}.chip{padding:10px 14px}.composer{z-index:5;background:linear-gradient(0deg,rgba(3,9,13,.96) 60%,rgba(3,9,13,.78) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}textarea{background:rgba(7,23,28,.77);border-color:rgba(34,224,208,.23);box-shadow:inset 0 1px 8px #0003;transition:border-color .25s ease,box-shadow .25s ease,background .25s ease}textarea:focus{background:rgba(8,31,36,.9);border-color:var(--cyan);box-shadow:0 0 0 3px #22e0d022,0 0 26px #22e0d012}textarea::placeholder{color:#719b9d}.send{position:relative;overflow:hidden;isolation:isolate;border:1px solid #a2fff477;background:linear-gradient(135deg,#65fff0,#22e0d0 45%,#1598c0);box-shadow:0 5px 22px #22e0d035,inset 0 1px 0 #ffffff8c;transition:transform .22s ease,box-shadow .22s ease,filter .22s ease}.send:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 8px 28px #22e0d055;filter:saturate(1.12)}.send:active{transform:scale(.96)}.send:disabled{opacity:.55;filter:saturate(.55);box-shadow:none}.note{transition:color .3s ease}.note:hover{color:#a3e9e4}
/* loading indicator while the assistant thinks */
.msg.thinking{display:flex;align-items:center;gap:10px}.msg.thinking:after{content:"";display:inline-block;width:25px;height:7px;background:radial-gradient(circle,var(--cyan) 2px,transparent 3px) 0 50%/9px 7px repeat-x;animation:monTyping .8s ease-in-out infinite}
@keyframes monOrbA{0%{transform:translate3d(0,0,0) scale(.9)}100%{transform:translate3d(18vw,12vh,0) scale(1.15)}}@keyframes monOrbB{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-16vw,-14vh,0) scale(.88)}}@keyframes monDust{from{background-position:0 0}to{background-position:0 290px}}@keyframes monEnter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes monLogoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(2deg)}}@keyframes monShine{0%,65%{transform:translateX(-130%) rotate(20deg)}85%,100%{transform:translateX(130%) rotate(20deg)}}@keyframes monTextGlow{0%,100%{text-shadow:0 0 10px #22e0d012}50%{text-shadow:0 0 22px #22e0d045}}@keyframes monLine{0%,100%{opacity:.45;transform:scaleX(.7)}50%{opacity:1;transform:scaleX(1.1)}}@keyframes monHeroGlow{0%,100%{text-shadow:0 5px 28px #0008,0 0 0 #22e0d000}50%{text-shadow:0 5px 28px #0008,0 0 28px #22e0d015}}@keyframes monBubbleIn{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(3px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes monTyping{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(-3px)}}
@media(max-width:520px){.hero{padding-top:28px}.msg{box-shadow:0 8px 22px #0002}.app:before{opacity:.1}body:before,body:after{opacity:.32}}
@media(hover:none){.msg:hover,.back:hover,.chip:hover,.btn:hover,.send:hover{transform:none;box-shadow:initial}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Improved composer, attachments and history */
.header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.mini-action{font:inherit;font-size:11px;color:var(--cyan);background:rgba(10,31,36,.75);border:1px solid #22e0d044;border-radius:11px;padding:9px 10px;cursor:pointer;transition:.2s}.mini-action:hover{transform:translateY(-2px);box-shadow:0 0 18px #22e0d022}
.composer{gap:8px;align-items:flex-end;border:1px solid rgba(34,224,208,.2);border-radius:23px;padding:10px;background:rgba(5,19,23,.9);box-shadow:0 12px 36px #0005,0 0 24px #22e0d00a;bottom:8px}.composer:focus-within{border-color:#22e0d077;box-shadow:0 0 0 3px #22e0d012,0 12px 36px #0005}
.compose-tools{display:flex;gap:6px;align-items:center}.attach{width:44px;height:46px;display:grid;place-items:center;border-radius:14px;border:1px solid #22e0d044;background:linear-gradient(145deg,#102b30,#09171c);color:var(--cyan);font-size:21px;cursor:pointer;transition:transform .2s,box-shadow .2s}.attach:hover{transform:translateY(-3px) rotate(-4deg);box-shadow:0 0 18px #22e0d033}.composer textarea{min-width:0;border:0;background:transparent;box-shadow:none;padding:12px 9px}.composer textarea:focus{box-shadow:none;background:transparent}.send{flex-shrink:0}.attachment-strip{display:none;gap:7px;flex-wrap:wrap;margin:0 0 8px}.attachment-strip.active{display:flex}.attachment-item{display:flex;align-items:center;gap:8px;max-width:100%;border:1px solid #22e0d044;background:#0a2025;border-radius:12px;padding:7px 9px;font-size:11px;color:#c8f8f2;animation:monBubbleIn .25s ease both}.attachment-item span{overflow-wrap:anywhere}.attachment-item button{border:0;background:transparent;color:#ff9d9d;font-size:16px;cursor:pointer}.history-panel{display:none;margin:12px 0;padding:12px;border:1px solid #22e0d033;border-radius:18px;background:rgba(5,20,24,.9);animation:monEnter .25s ease both}.history-panel.open{display:block}.history-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12px;color:var(--cyan)}.history-list{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}.history-row{display:flex;gap:7px}.history-open{flex:1;min-width:0;text-align:right;color:var(--text);background:#0b2025;border:1px solid #17444b;border-radius:11px;padding:10px;font:inherit;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.history-delete{border:1px solid #55353b;background:#24151a;color:#ffb7bd;border-radius:10px;padding:0 10px;cursor:pointer}.empty-history{font-size:11px;color:var(--muted);padding:10px}.msg .file-label{display:block;margin-top:6px;color:#d1fff8;font-size:11px;opacity:.8}.msg.error{border-color:#b45d6a;color:#ffd4d8}
@media(max-width:520px){.header-actions{gap:5px}.mini-action{padding:8px;font-size:10px}.composer{gap:6px;padding:7px}.attach{width:39px;height:44px}.compose-tools{gap:5px}.history-panel{margin-top:8px}}
</style></head><body><main class="app"><header><div class="logo">M</div><div class="brand"><h1>MON AI</h1><p>همراه هوشمند تو · همیشه آماده‌ی شنیدن</p></div><div class="header-actions"><button type="button" class="mini-action" id="historyToggle">◷ تاریخچه</button><button type="button" class="mini-action" id="newChat">＋ گفت‌وگوی جدید</button><a class="back" href="./index.html">صفحه اصلی</a></div></header><section class="hero"><div class="eyebrow">YOUR AI COMPANION</div><h2>اینجا می‌تونی خودت باشی.</h2><p>حرف بزن، خالی شو، فکر کن. بدون قضاوت گوش می‌دم. 💠</p></section><section class="history-panel" id="historyPanel"><div class="history-head"><span>گفت‌وگوهای ذخیره‌شده</span><button type="button" class="mini-action" id="closeHistory">بستن</button></div><div class="history-list" id="historyList"></div></section><section class="chat" id="chat" aria-live="polite"><div class="msg assistant">سلام! من MON AI هستم. 💠<br>دوست داری از چی حرف بزنیم؟</div></section><div class="suggestions" id="suggestions"><button class="chip">امروز حالم خوب نیست</button><button class="chip">فقط بهم گوش بده</button><button class="chip">کمکم کن فکر کنم</button></div><div class="attachment-strip" id="attachmentStrip"></div><form class="composer" id="form"><div class="compose-tools"><button class="attach" type="button" id="attachButton" aria-label="افزودن فایل یا عکس" title="افزودن عکس یا فایل">＋</button><input id="fileInput" type="file" accept="image/*,.txt,.md,.csv,.json,.pdf" multiple hidden></div><textarea id="message" rows="1" placeholder="پیامت رو اینجا بنویس..." aria-label="پیام"></textarea><button class="send" type="submit" aria-label="ارسال">➤</button></form><div class="note" id="status">رابط MON AI آماده است؛ برای پاسخ هوشمند باید سرور و API متصل شوند.</div></main><script>
const $=s=>document.querySelector(s),chat=$('#chat'),input=$('#message'),form=$('#form'),sendButton=form.querySelector('.send');
const API_URL='https://mon-ai-api.mrsam7104.workers.dev';
const SYSTEM={role:'system',content:'تو MON AI، همراه هوشمند فارسی‌زبان و محترمانه‌ای هستی. با همدلی، دقت و پاسخ‌های نسبتاً کوتاه جواب بده. اگر کاربر فقط می‌خواهد درد دل کند، اول با دقت گوش بده و قضاوت نکن.'};
const STORE='mon_ai_conversations_v2';
let conversations=loadConversations(),currentId=null,history=[SYSTEM],attachments=[],busy=false;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function loadConversations(){try{const x=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(conversations.slice(0,40)))}catch{$('#status').textContent='فضای ذخیره‌سازی مرورگر پر است؛ فایل‌های پیوست در تاریخچه ذخیره نمی‌شوند.'}}
function current(){return conversations.find(c=>c.id===currentId)}
function ensureConversation(){if(!currentId||!current()){currentId=uid();conversations.unshift({id:currentId,title:'گفت‌وگوی جدید',updated:Date.now(),messages:[]})}}
function saveMessage(role,text,files=[]){ensureConversation();const c=current();c.messages.push({role,text,files,time:Date.now()});if(c.messages.length===1&&role==='user')c.title=text.slice(0,55)||files.join(', ')||'گفت‌وگوی جدید';c.updated=Date.now();conversations.sort((a,b)=>b.updated-a.updated);persist();renderHistory()}
function add(text,role,files=[]){const el=document.createElement('div');el.className='msg '+role;const body=document.createElement('div');body.textContent=text;el.appendChild(body);if(files.length){const f=document.createElement('span');f.className='file-label';f.textContent='📎 '+files.join('، ');el.appendChild(f)}const t=document.createElement('span');t.className='time';t.textContent=new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});el.appendChild(t);chat.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'});return el}
function renderHistory(){const list=$('#historyList');list.replaceChildren();if(!conversations.length){const e=document.createElement('div');e.className='empty-history';e.textContent='هنوز گفت‌وگویی ذخیره نشده.';list.appendChild(e);return}conversations.forEach(c=>{const row=document.createElement('div');row.className='history-row';const b=document.createElement('button');b.className='history-open';b.textContent=(c.title||'گفت‌وگو')+' · '+new Date(c.updated).toLocaleDateString('fa-IR');b.onclick=()=>openConversation(c.id);const d=document.createElement('button');d.className='history-delete';d.textContent='×';d.title='حذف گفت‌وگو';d.onclick=()=>{if(!confirm('این گفت‌وگو حذف شود؟'))return;conversations=conversations.filter(x=>x.id!==c.id);if(currentId===c.id)newConversation();persist();renderHistory()};row.append(b,d);list.appendChild(row)})}
function openConversation(id){const c=conversations.find(x=>x.id===id);if(!c)return;currentId=id;history=[SYSTEM];chat.replaceChildren();c.messages.forEach(m=>{add(m.text,m.role,m.files||[]);if(m.apiContent)history.push({role:m.role,content:m.apiContent});else if(m.role==='user'||m.role==='assistant')history.push({role:m.role,content:m.text})});$('#historyPanel').classList.remove('open');$('#status').textContent='تاریخچه بارگذاری شد؛ پیام‌های جدید به همین گفت‌وگو اضافه می‌شوند.'}
function newConversation(){currentId=uid();history=[SYSTEM];attachments=[];renderAttachments();chat.replaceChildren();add('سلام! من MON AI هستم. 💠\nدوست داری از چی حرف بزنیم؟','assistant');$('#suggestions').style.display='flex';$('#historyPanel').classList.remove('open');saveMessage('assistant','سلام! من MON AI هستم. 💠\nدوست داری از چی حرف بزنیم؟')}
function renderAttachments(){const strip=$('#attachmentStrip');strip.replaceChildren();strip.classList.toggle('active',attachments.length>0);attachments.forEach((a,i)=>{const item=document.createElement('div');item.className='attachment-item';const label=document.createElement('span');label.textContent=(a.kind==='image'?'🖼️ ':'📎 ')+a.file.name;const rm=document.createElement('button');rm.type='button';rm.textContent='×';rm.setAttribute('aria-label','حذف پیوست');rm.onclick=()=>{attachments.splice(i,1);renderAttachments()};item.append(label,rm);strip.append(item)})}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('خواندن فایل ناموفق بود: '+file.name));if(file.type.startsWith('image/'))r.readAsDataURL(file);else if(/\.(txt|md|csv|json)$/i.test(file.name))r.readAsText(file);else r.readAsDataURL(file)})}
$('#attachButton').onclick=()=>$('#fileInput').click();
$('#fileInput').addEventListener('change',e=>{for(const file of Array.from(e.target.files||[])){if(file.size>8*1024*1024){add('حجم فایل «'+file.name+'» بیشتر از ۸ مگابایت است.','assistant error');continue}attachments.push({file,kind:file.type.startsWith('image/')?'image':'file'});}renderAttachments();e.target.value=''});
$('#historyToggle').onclick=()=>{$('#historyPanel').classList.toggle('open');renderHistory()};
$('#closeHistory').onclick=()=>$('#historyPanel').classList.remove('open');
$('#newChat').onclick=()=>newConversation();
async function callMonAI(messages){
 const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
 let data;try{data=await response.json()}catch{throw new Error('پاسخ سرور قابل خواندن نیست.')}
 if(!response.ok)throw new Error(data?.error?.message||data?.error||('خطای سرور: '+response.status));
 let answer=data?.choices?.[0]?.message?.content;
 if(Array.isArray(answer))answer=answer.map(part=>typeof part==='string'?part:(part.text||'')).filter(Boolean).join('\n');
 if(typeof answer!=='string'||!answer.trim())throw new Error(data?.error?.message||'پاسخ خالی دریافت شد؛ مدل یا تنظیمات Worker را بررسی کن.');
 return {answer:answer.trim(),finishReason:data?.choices?.[0]?.finish_reason,usage:data?.usage};

async function send(text){text=(text??input.value).trim();if((!text&&!attachments.length)||busy)return;busy=true;const selected=attachments.slice();attachments=[];renderAttachments();input.value='';input.style.height='auto';$('#suggestions').style.display='none';const names=selected.map(a=>a.file.name);add(text||'فایل(ها) ارسال شد', 'user',names);saveMessage('user',text,names);const pending=document.createElement('div');pending.className='msg assistant thinking';pending.textContent='دارم بهت فکر می‌کنم…';chat.appendChild(pending);pending.scrollIntoView({behavior:'smooth',block:'end'});sendButton.disabled=true;input.disabled=true;$('#attachButton').disabled=true;$('#status').textContent='MON AI در حال فکر کردن است…';

 const userContent=content.length===1&&content[0].type==='text'?content[0].text:content;

 let result=await callMonAI([SYSTEM,...conversation.slice(-24)]);

   const continuationMessages=[SYSTEM,...conversation.slice(-22),{role:'assistant',content:answer},{role:'user',content:'ادامه‌ی پاسخ قبلی را دقیقاً از همان‌جا ادامه بده. متن قبلی را تکرار نکن و پاسخ را کامل کن.'}];
   result=await callMonAI(continuationMessages);

   answer+='\n'+result.answer;
 }

 const c=current();if(c){const lastUser=[...c.messages].reverse().find(m=>m.role==='user');if(lastUser)lastUser.apiContent=typeof userContent==='string'?userContent:'[پیوست‌ها در تاریخچه ذخیره نشده‌اند] '+text;persist()}
 $('#status').textContent=result.finishReason==='length'?'پاسخ نمایش داده شد؛ برای پاسخ‌های خیلی طولانی از مدل/Worker سقف توکن بالاتری تنظیم کن.':'MON AI متصل است · تاریخچه ذخیره می‌شود';
}catch(error){pending.remove();const msg='ارسال ناموفق بود: '+(error.message||'اتصال ناموفق بود.')+' لطفاً دوباره تلاش کن.';add(msg,'assistant error');$('#status').textContent='ارسال ناموفق؛ تنظیمات Worker/API یا فرمت فایل را بررسی کن.';}finally{busy=false;sendButton.disabled=false;input.disabled=false;$('#attachButton').disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();send()});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#suggestions').addEventListener('click',e=>{if(e.target.classList.contains('chip'))send(e.target.textContent)});
